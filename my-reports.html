<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>我的通報｜路見不平通報系統</title>
<style>
  body {
    font-family: Arial;
    max-width: 900px;
    margin: 30px auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  button {
    padding: 8px 14px;
    cursor: pointer;
  }
  .card {
    border: 1px solid #ccc;
    padding: 15px;
    margin-top: 20px;
    border-radius: 6px;
  }
  .report {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
  }
  .report img {
    width: 140px;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
  }
  .report-info {
    flex: 1;
  }
  .status {
    font-weight: bold;
  }
  .status.submitted { color: #555; }
  .status.processing { color: #f39c12; }
  .status.completed { color: #27ae60; }
  .severity.urgent { color: #e74c3c; }
  .severity.normal { color: #2c3e50; }
</style>
</head>
<body>

<header>
  <h2>我的通報</h2>
  <button id="backBtn">返回</button>
</header>

<div id="list"></div>

<!-- 🔐 登入守門 -->
<script type="module" src="auth-guard.js"></script>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  getDocs
} from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* ===== Firebase 設定 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDQziEhhw0dPu_io9sfWT-a3sADgIKFSd4",
  authDomain: "system-b4d2d.firebaseapp.com",
  projectId: "system-b4d2d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

backBtn.onclick = () => history.back();

/* ===== 載入我的通報 ===== */
async function loadMyReports() {
  const user = auth.currentUser;
  if (!user) return;

  const q = query(
    collection(db, "reports"),
    where("createdBy", "==", user.uid),
    orderBy("createdAt", "desc")
  );

  const snap = await getDocs(q);

  if (snap.empty) {
    list.innerHTML = "<p>尚未有任何通報紀錄</p>";
    return;
  }

  snap.forEach(docSnap => {
    const r = docSnap.data();

    const div = document.createElement("div");
    div.className = "card report";
div.style.cursor = "pointer";

div.onclick = () => {
  location.href = `report-detail.html?id=${docSnap.id}`;
};
    div.innerHTML = `
      <img src="${r.imageUrl}" alt="通報照片">
      <div class="report-info">
        <h3>${r.title}</h3>
        <p>${r.description}</p>
        <p>
          <span class="severity ${r.severity}">
            嚴重程度：${r.severity === "urgent" ? "緊急" : "一般"}
          </span>
        </p>
        <p class="status ${r.status}">
          狀態：${statusText(r.status)}
        </p>
        <small>${formatDate(r.createdAt)}</small>
      </div>
    `;

    list.appendChild(div);
  });
}

/* ===== 狀態顯示文字 ===== */
function statusText(status) {
  switch (status) {
    case "submitted": return "已送出";
    case "processing": return "處理中";
    case "completed": return "已完成";
    default: return status;
  }
}

/* ===== 時間格式 ===== */
function formatDate(ts) {
  if (!ts) return "";
  const d = ts.toDate();
  return d.toLocaleString("zh-TW");
}

/* ===== 初始化 ===== */
import { onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (user) {
    loadMyReports();
  }
});
</script>

</body>
</html>
