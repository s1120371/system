<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>新增通報</title>
<style>
  body {
    font-family: Arial;
    max-width: 800px;
    margin: 30px auto;
  }
  input, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header button {
  width: auto;        /* ⭐ 修正點 */
  padding: 6px 12px;
  margin-top: 0;      /* header 不需要上間距 */
}

  input, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
  }
  textarea {
    resize: vertical;
    height: 100px;
  }
  .card {
    border: 1px solid #ccc;
    padding: 15px;
    margin-top: 20px;
    border-radius: 6px;
  }
  .row {
    display: flex;
    gap: 10px;
  }

  /* 嚴重程度按鈕 */
  .severity-buttons {
    display: flex;
    gap: 16px;
    margin-top: 8px;
  }
  .severity-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    border-radius: 6px;
  }
  .severity-btn.active {
    background: #e0e0e0;
    border-color: #666;
  }
  .severity-btn.urgent.active {
    background: #ffe5e5;
    border-color: #e74c3c;
    color: #e74c3c;
  }
</style>
</head>
<body>

<header>
  <h2>新增通報</h2>
  <button onclick="history.back()">返回</button>
</header>

<div class="card">
  <label>標題 *</label>
  <input id="title">

  <label>描述 *</label>
  <textarea id="desc"></textarea>

  <label>嚴重程度 *</label>
  <div class="severity-buttons">
    <button type="button" class="severity-btn active" data-value="normal">一般</button>
    <button type="button" class="severity-btn urgent" data-value="urgent">緊急</button>
  </div>
  <input type="hidden" id="severity" value="normal">

  <label>GPS / 經緯度 *</label>
  <div class="row">
    <input id="lat" placeholder="緯度">
    <input id="lng" placeholder="經度">
  </div>
  <button type="button" id="gpsBtn">自動取得目前位置</button>

  <label>照片 *</label>
  <input type="file" id="image" accept="image/*">

  <button id="submitBtn">送出通報</button>
</div>

<!-- 🔐 登入守門 -->
<script type="module" src="auth-guard.js"></script>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDQziEhhw0dPu_io9sfWT-a3sADgIKFSd4",
  authDomain: "system-b4d2d.firebaseapp.com",
  projectId: "system-b4d2d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===== Cloudinary ===== */
const CLOUD_NAME = "dntuqyn7t";
const UPLOAD_PRESET = "report_images";

/* ===== DOM ===== */
const titleInput = document.getElementById("title");
const descInput = document.getElementById("desc");
const latInput = document.getElementById("lat");
const lngInput = document.getElementById("lng");
const imageInput = document.getElementById("image");
const submitBtn = document.getElementById("submitBtn");

/* ===== 嚴重程度按鈕 ===== */
const buttons = document.querySelectorAll(".severity-btn");
const severityInput = document.getElementById("severity");

buttons.forEach(btn => {
  btn.onclick = () => {
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    severityInput.value = btn.dataset.value;
  };
});

/* ===== GPS ===== */
gpsBtn.onclick = () => {
  navigator.geolocation.getCurrentPosition(pos => {
    latInput.value = pos.coords.latitude;
    lngInput.value = pos.coords.longitude;
  }, () => alert("無法取得 GPS 位置"));
};

/* ===== 送出通報 ===== */
submitBtn.onclick = async () => {
  try {
    const user = auth.currentUser;
    if (!user) throw new Error("尚未登入");

    const title = titleInput.value.trim();
    const desc = descInput.value.trim();
    const lat = parseFloat(latInput.value);
    const lng = parseFloat(lngInput.value);
    const file = imageInput.files[0];
    const severity = severityInput.value;

    if (!title || !desc || !file) {
      throw new Error("請填寫標題、描述並上傳照片");
    }

    if (isNaN(lat) || isNaN(lng)) {
      throw new Error("請提供 GPS / 經緯度");
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "上傳中...";

    /* Cloudinary */
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", UPLOAD_PRESET);

    const imgRes = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      { method: "POST", body: fd }
    );
    const imgData = await imgRes.json();
    if (!imgData.secure_url) throw new Error("圖片上傳失敗");

    /* Firestore */
    await addDoc(collection(db, "reports"), {
      title,
      description: desc,
      severity,
      latitude: Number(lat),
      longitude: Number(lng),
      imageUrl: imgData.secure_url,
      status: "submitted",
      createdBy: user.uid,
      createdAt: serverTimestamp()
    });

    alert("通報已送出");
    location.href = "user.html";

  } catch (err) {
    alert(err.message);
    submitBtn.disabled = false;
    submitBtn.innerText = "送出通報";
  }
};
</script>

</body>
</html>
